name: Build LibWrt (upstream-complete) for Redmi AX6

# 与 build.yml 的区别：不手工裁剪 .config。
# 基线完全来自上游 `make defconfig`，本仓库只追加 WG + rtp2httpd + LAN 网段。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'LibWrt 分支/标签（默认 25.12-nss）'
        required: false
        default: '25.12-nss'

permissions:
  contents: read

jobs:
  build:
    name: qualcommax/ipq807x redmi_ax6-stock (upstream-complete)
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Runner specs
        run: |
          echo "CPU: $(nproc)"; free -h; df -h /

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev rsync unzip zlib1g-dev file \
            wget cpio python3 python3-setuptools swig time xsltproc libelf-dev \
            ecj fastjar java-propose-classpath subversion device-tree-compiler \
            ccache upx-ucl

      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Clone LibWrt
        run: |
          REF="${{ github.event.inputs.ref }}"
          [ -z "$REF" ] && REF="25.12-nss"
          git clone --depth 1 --single-branch -b "$REF" \
            https://github.com/LiBwrt/LibWrt.git openwrt
          cd openwrt
          echo "LibWrt ref: $REF"
          git log -1 --format='HEAD %H %ad %s'

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "===== feeds 清单 ====="
          cat feeds.conf.default

      - name: Build config (upstream full baseline + additions only)
        run: |
          set -e
          cd openwrt

          # ---- 1) 只带目标设备，先让 kconfig 展开上游全部默认 ----
          grep -E '^CONFIG_TARGET_' ../configs/ax6-upstream.config > .config
          make defconfig
          cp .config /tmp/config.upstream-defaults

          # 设备符号必须在第一遍就生效（第二遍再写 TARGET_ 会重置 choice）
          if ! grep -qx 'CONFIG_TARGET_DEVICE_qualcommax_ipq807x_DEVICE_redmi_ax6-stock=y' .config; then
            echo "::error::第一遍 defconfig 未选中 redmi_ax6-stock 设备"
            grep -E '^CONFIG_TARGET_(MULTI_PROFILE|DEVICE_)' .config | head -20
            exit 1
          fi
          echo "OK   设备 = redmi_ax6-stock"

          # ---- 2) 再追加本仓库增量：不重复写 TARGET_ 行，也不含任何 =n 裁剪项 ----
          grep -vE '^CONFIG_TARGET_' ../configs/ax6-upstream.config >> .config
          make defconfig

          # ---- 3) 上游默认是否被完整保留 ----
          echo "===== 上游默认保留校验 ====="
          UPK=$(grep -c '^CONFIG_PACKAGE_.*=y$' /tmp/config.upstream-defaults || true)
          FINK=$(grep -c '^CONFIG_PACKAGE_.*=y$' .config || true)
          echo "上游 defconfig 包数: $UPK"
          echo "最终配置包数:      $FINK"
          if [ "$FINK" -lt "$UPK" ]; then
            echo "::error::最终配置比上游默认少了 $((UPK-FINK)) 个包，出现裁剪，中止"
            exit 1
          fi
          OFF=$(grep -cE '^CONFIG_[A-Za-z0-9_]+=n$' .config || true)
          echo "配置中显式 =n 的符号数: $OFF（应接近 0，出现即说明有裁剪）"

          # ---- 4) 关键符号必须在 ----
          echo "===== 关键符号核对 ====="
          FAIL=0
          for s in \
            CONFIG_TARGET_DEVICE_qualcommax_ipq807x_DEVICE_redmi_ax6-stock \
            CONFIG_PACKAGE_kmod-wireguard \
            CONFIG_PACKAGE_wireguard-tools \
            CONFIG_PACKAGE_luci-proto-wireguard \
            CONFIG_PACKAGE_rpcd-mod-wireguard \
            CONFIG_PACKAGE_rtp2httpd \
            CONFIG_PACKAGE_luci-app-rtp2httpd \
            CONFIG_PACKAGE_luci-i18n-rtp2httpd-zh-cn \
            CONFIG_PACKAGE_ddns-scripts \
            CONFIG_PACKAGE_ddns-scripts-services \
            CONFIG_PACKAGE_ddns-scripts-cloudflare \
            CONFIG_PACKAGE_luci-app-ddns \
            CONFIG_PACKAGE_cloudflared \
            CONFIG_PACKAGE_luci-app-cloudflared \
            CONFIG_PACKAGE_kmod-tun \
            CONFIG_PACKAGE_tailscale \
            CONFIG_PACKAGE_kmod-inet-diag \
            CONFIG_PACKAGE_htop \
            CONFIG_PACKAGE_luci-app-tailscale-community \
            CONFIG_PACKAGE_tcpdump \
            CONFIG_PACKAGE_ttyd \
            CONFIG_PACKAGE_luci-i18n-base-zh-cn \
            CONFIG_PACKAGE_watchcat \
            CONFIG_PACKAGE_bind-dig \
            CONFIG_PACKAGE_nlbwmon \
            CONFIG_PACKAGE_iperf3 \
            CONFIG_PACKAGE_mtr \
            CONFIG_PACKAGE_wifischedule \
            CONFIG_PACKAGE_logrotate \
            CONFIG_PACKAGE_zram-swap \
            CONFIG_PACKAGE_luci-app-wifihistory \
            CONFIG_PACKAGE_luci \
            CONFIG_PACKAGE_wpad-openssl \
            CONFIG_PACKAGE_kmod-qca-nss-drv \
            CONFIG_PACKAGE_kmod-qca-nss-ecm \
            CONFIG_PACKAGE_kmod-ath11k \
            CONFIG_PACKAGE_odhcp6c
          do
            if grep -qx "$s=y" .config; then
              echo "OK   $s"
            else
              echo "MISS $s"; FAIL=$((FAIL+1))
            fi
          done
          if [ "$FAIL" -gt 0 ]; then
            echo "::error::有 $FAIL 个关键符号未生效"
            exit 1
          fi

          echo "===== 设备 profile ====="
          grep -E '^CONFIG_TARGET_(PROFILE|DEVICE_qualcommax)' .config

      - name: Set default LAN to 192.168.99.1
        run: |
          set -e
          cd openwrt
          F=package/base-files/files/bin/config_generate
          sed -i 's/192\.168\.1\.1/192.168.99.1/g' "$F"
          grep -n '192\.168\.99\.1' "$F" | head -3
          if grep -q '192\.168\.1\.1' "$F"; then
            echo "::error::替换失败，仍存在 192.168.1.1"; exit 1
          fi
          echo "::notice::默认 LAN = 192.168.99.1/24（账号/密钥/SSID 等敏感信息仍不进入镜像）"
      - name: Print upstream DEFAULT_PACKAGES (证明未裁剪)
        run: |
          cd openwrt
          sed -n '/^DEFAULT_PACKAGES/,/^$/p' target/linux/qualcommax/Makefile
          echo "===== AX6 stock 设备定义 ====="
          grep -A8 'define Device/redmi_ax6-stock' target/linux/qualcommax/image/ipq807x.mk

      - name: Download package sources
        run: |
          cd openwrt
          make download -j8 || make download -j1 V=s

      - name: Build firmware
        run: |
          cd openwrt
          make -j$(($(nproc)+1)) || make -j1 V=s

      - name: Collect outputs
        if: always()
        run: |
          cd openwrt
          mkdir -p ../out
          find bin/targets/qualcommax/ipq807x -maxdepth 1 -type f \
            \( -name '*.bin' -o -name '*.ubi' -o -name '*.itb' -o -name 'sha256sums' \) \
            -exec cp {} ../out/ \; 2>/dev/null || true
          cp .config ../out/ax6-upstream.build.config 2>/dev/null || true
          echo "===== 产物 ====="
          ls -lh ../out/ || true

      - name: Verify image metadata
        if: always()
        run: |
          cd out 2>/dev/null || exit 0
          IMG=$(ls *sysupgrade.bin 2>/dev/null | head -1)
          [ -z "$IMG" ] && { echo "::warning::未找到 sysupgrade.bin"; exit 0; }
          echo "镜像: $IMG"; ls -lh "$IMG"
          echo "===== supported_devices ====="
          strings -a "$IMG" | grep -o '"supported_devices":\[[^]]*\]' | head -3
          if strings -a "$IMG" | grep -q 'redmi,ax6-stock'; then
            echo "::notice::元数据含 redmi,ax6-stock，可刷"
          else
            echo "::warning::元数据不含 redmi,ax6-stock，请勿刷入"
          fi

      - name: Upload firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libwrt-ax6-stock-upstream-${{ github.run_number }}
          path: out/
          if-no-files-found: warn
          retention-days: 30
